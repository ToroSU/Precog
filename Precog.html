<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precog</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/system-info.css" />
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" class="h-screen max-w-[1900px] mx-auto p-3 font-sans flex flex-col gap-3">
    <div v-if="dragOver" class="drop-overlay">Drop files here</div>

    <div v-if="!hasData"
         class="flex-1 flex items-center justify-center"
         @dragenter.prevent="onDragEnter"
         @dragover.prevent="onDragOver"
         @dragleave.prevent="onDragLeave"
         @drop.prevent="handleDrop">
      <div :class="['w-full max-w-3xl rounded-3xl border-4 border-dashed bg-white shadow-sm p-10 text-center transition-all', dragOver ? 'border-blue-500 bg-blue-50 scale-[1.01]' : 'border-slate-300']">
        <input id="folderInput" type="file" webkitdirectory directory multiple class="hidden" @change="handleBatchUpload">
        <input id="zipInput" type="file" accept=".zip,application/zip" class="hidden" @change="handleZipUpload">
          <div class="text-7xl mb-5">👁️</div>
          <h1 class="text-3xl font-black tracking-tight text-slate-900">Precog</h1>
          <p class="mt-3 text-slate-500">Platform Insight Tool</p>
          <p class="mt-2 text-xs text-slate-400">請拖拉 Dowsing folder / .zip，或使用下方按鈕選取</p>
        </label>
        <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
          <button @click.stop="openFolderPicker" class="px-5 py-3 rounded-2xl bg-slate-900 text-white text-sm font-black hover:bg-slate-700">Select Dowsing Folder</button>
          <button @click.stop="openZipPicker" class="px-5 py-3 rounded-2xl bg-blue-600 text-white text-sm font-black hover:bg-blue-700">Select Dowsing ZIP</button>
        </div>
      </div>
    </div>

    <template v-else>
      <div class="compact-app-header bg-white rounded-3xl shadow-sm border border-slate-200 px-4 shrink-0">
        <div class="compact-app-header-inner">
          <div class="compact-brand shrink-0" title="Driver / Device / Platform Insight & Triage System">
            <h1 class="text-xl font-black tracking-tight text-slate-900">Precog</h1>
            <span class="text-[10px] font-bold px-2 py-1 rounded-full bg-slate-900 text-white">v1.0</span>
          </div>

          <nav class="compact-nav custom-scrollbar" aria-label="Primary navigation">
            <button @click="selectedPanel='system'" :class="navClass('system')">System Info</button>
            <button @click="selectedOem = null; selectedPanel='overview'" :class="navClass('overview')">Driver Status</button>
            <button @click="selectedPanel='deviceManager'; deviceManagerView='devices'" :class="navClass('deviceManager')">Device Manager</button>
            <button @click="selectedPanel='platform'" :class="navClass('platform')">System Health</button>
            <button @click="selectedPanel='apps'" :class="navClass('apps')">Apps</button>
            <button @click="selectedPanel='systemLogs'" :class="navClass('systemLogs')">System Logs</button>
            <button @click="selectedPanel='collection'" :class="navClass('collection')">Log Collection</button>
          </nav>

          <div class="compact-machine-context shrink-0" title="Machine Context">
            <div class="compact-machine-model" :title="systemHeadline.model || 'N/A'">
              <span aria-hidden="true">▣</span>
              <span>{{ systemHeadline.model || 'N/A' }}</span>
            </div>
            <div class="compact-machine-meta">
              <span>{{ systemHeadline.sku || 'N/A' }}</span>
              <span class="context-dot">•</span>
              <span :title="systemHeadline.bios || 'N/A'">{{ (systemHeadline.bios || 'N/A').split('|')[0].trim() }}</span>
              <span class="context-dot">•</span>
              <span class="compact-source" :title="loadedSourceName">{{ loadedSourceName || 'N/A' }}</span>
            </div>
          </div>

          <button @click="resetTool" class="px-4 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 text-sm font-semibold shrink-0">Reload</button>
        </div>
      </div>

      <div v-if="selectedPanel==='deviceManager'" class="flex-1 min-h-0 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="p-4 border-b bg-slate-50 flex flex-col gap-3 shrink-0">
          <div class="flex flex-col lg:flex-row gap-3 lg:items-center lg:justify-between">
            <div>
              <h2 class="text-lg font-black">Device Manager</h2>
              <p class="text-xs text-slate-500 mt-1">Inspect the platform as a full PnP device tree or as a focused hardware inventory.</p>
            </div>
            <div class="inline-flex self-start lg:self-auto rounded-xl border border-slate-200 bg-white p-1" role="tablist" aria-label="Device Manager views">
              <button @click="deviceManagerView='devices'" :class="['px-4 py-2 rounded-lg text-xs font-black transition-colors', deviceManagerView==='devices' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50']">Devices</button>
              <button @click="deviceManagerView='hardware'" :class="['px-4 py-2 rounded-lg text-xs font-black transition-colors', deviceManagerView==='hardware' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50']">Hardware List</button>
            </div>
          </div>
          <div v-if="deviceManagerView==='devices'" class="flex flex-wrap gap-2 items-center lg:justify-end">
            <input v-model.trim="deviceKeyword" placeholder="Filter device / HWID / driver" class="rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-200 min-w-[260px]">
            <button @click="deviceOnlyProblem=!deviceOnlyProblem" :class="['px-3 py-2 rounded-xl border text-xs font-bold', deviceOnlyProblem ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 hover:bg-slate-50']">Problems only</button>
            <button @click="deviceOnlyHighlighted=!deviceOnlyHighlighted" :class="['px-3 py-2 rounded-xl border text-xs font-bold', deviceOnlyHighlighted ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 hover:bg-slate-50']">Selected INF only</button>
          </div>
        </div>
        <div v-if="deviceManagerView==='devices'" class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-12 gap-0">
          <div class="xl:col-span-5 border-r min-h-0 overflow-y-auto custom-scrollbar p-2 space-y-2">
            <div v-for="group in filteredDeviceGroups" :key="group.className" class="rounded-2xl border overflow-hidden">
              <div @click="toggleDeviceClass(group.className)" class="bg-slate-50 px-4 py-2 font-black text-sm border-b flex justify-between items-center cursor-pointer select-none hover:bg-slate-100">
                <span class="flex items-center min-w-0"><span class="inline-block w-4 text-slate-400 shrink-0">{{ isDeviceClassCollapsed(group.className) ? '▸ ' : '▾ ' }}</span><span class="mr-2 shrink-0" aria-hidden="true">{{ getDeviceCategoryEmoji(group.className) }}</span><span class="truncate">{{ group.className }}</span></span>
                <span class="text-xs text-slate-400">{{ group.devices.length }}</span>
              </div>
              <div v-show="!isDeviceClassCollapsed(group.className)" class="divide-y divide-slate-100">
                <div v-for="dev in group.devices" :key="dev.instanceId" @click="selectedDevice=dev"
                     :class="['p-2.5 text-sm cursor-pointer border-l-4', selectedDevice && selectedDevice.instanceId===dev.instanceId ? 'bg-blue-50 border-l-blue-600' : isHighlightedDevice(dev) ? 'bg-blue-50/60 border-l-blue-400' : dev.isProblem ? 'bg-red-50 border-l-red-400' : dev.isGhost ? 'bg-amber-50/60 border-l-amber-300' : 'border-l-transparent hover:bg-slate-50']">
                  <div class="flex items-start justify-between gap-2">
                    <div :class="['font-bold min-w-0 truncate', dev.isGhost ? 'text-slate-500' : 'text-slate-900']">{{ dev.name }}</div>
                    <span v-if="dev.isProblem" class="pc-badge px-2 py-1 text-[10px] font-black bg-red-100 text-red-700 shrink-0">PROBLEM</span>
                    <span v-else-if="dev.isGhost" class="pc-badge px-2 py-1 text-[10px] font-black bg-slate-100 text-slate-500 shrink-0">GHOST</span>
                    <span v-else-if="dev.status && dev.status !== 'OK'" class="pc-badge px-2 py-1 text-[10px] font-black bg-slate-100 text-slate-600 shrink-0">{{ dev.status }}</span>
                  </div>
                  <div class="text-[11px] text-slate-500 mt-1 break-all">{{ dev.instanceId }}</div>
                  <div class="mt-2 text-[11px] text-slate-500 break-all"><b>Driver:</b> {{ dev.activeDriver || 'N/A' }}</div>
                </div>
              </div>
            </div>
            <div v-if="!filteredDeviceGroups.length" class="text-slate-400 font-semibold text-center py-10">No matched devices.</div>
          </div>
          <div class="xl:col-span-7 min-h-0 overflow-y-auto custom-scrollbar p-4">
            <div v-if="selectedDevice" class="space-y-4">
              <div class="pc-identity-header">
                <button @click="showDeviceOverview" class="pc-identity-back">← Device Overview</button>
                <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-3">
                  <div class="min-w-0">
                    <div class="pc-eyebrow-dark">Device Identity</div>
                    <h3 class="pc-identity-title">{{ selectedDevice.name }}</h3>
                    <div class="pc-identity-subtitle">{{ selectedDevice.instanceId }} <a v-if="getDeviceHuntInfo(selectedDevice.instanceId)" :href="getDeviceHuntInfo(selectedDevice.instanceId).url" target="_blank" rel="noopener noreferrer" class="ml-2 text-blue-300 hover:text-blue-200 hover:underline font-semibold whitespace-nowrap">[DeviceHunt]</a></div>
                  </div>
                  <button v-if="getDriverObjectByName(selectedDevice.activeDriver)" @click="openDriverFromDevice(selectedDevice)" class="pc-btn pc-btn-light">Open Driver Detail</button>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="pc-property-card"><div class="label">Class</div><div class="value">{{ selectedDevice.className || 'N/A' }}</div></div>
                <div class="pc-property-card"><div class="label">Status</div><div :class="['value', selectedDevice.isProblem ? 'text-red-700' : selectedDevice.isGhost ? 'text-amber-700' : 'text-emerald-700']">{{ selectedDevice.isGhost ? 'GHOST / CM_PROB_PHANTOM' : (selectedDevice.problem || selectedDevice.status || 'OK') }}</div></div>
                <div class="pc-property-card"><div class="label">Active / Best Driver</div><div class="value break-all">{{ selectedDevice.activeDriver || 'N/A' }}</div></div>
                <div class="pc-property-card"><div class="label">Signer</div><div class="value break-all">{{ selectedDevice.signer || 'N/A' }}</div></div>
                <div class="pc-property-card"><div class="label">Version</div><div class="value">{{ selectedDevice.version || 'N/A' }}</div></div>
                <div class="pc-property-card"><div class="label">Driver Status</div><div class="value break-all">{{ selectedDevice.activeDriverStatus || 'N/A' }}</div></div>
              </div>
              <div v-if="selectedDevice.deviceStatus" class="rounded-2xl border border-slate-200 overflow-hidden">
                <div class="pc-section-heading flex items-center justify-between gap-3">
                  <div><h3 class="font-black">Device Status</h3><p class="text-[11px] text-slate-300 mt-1">Windows Configuration Manager / DevNode diagnostics</p></div>
                  <span :class="['px-3 py-1 rounded-full text-xs font-black', selectedDevice.deviceStatus.ProblemCode && Number(selectedDevice.deviceStatus.ProblemCode)!==0 ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700']">Code {{ selectedDevice.deviceStatus.ProblemCode ?? 0 }}</span>
                </div>
                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                  <div class="rounded-xl bg-slate-50 border p-3"><div class="card-label">Problem Name</div><div class="mt-1 font-bold break-all">{{ selectedDevice.deviceStatus.ProblemName || 'CM_PROB_NONE' }}</div></div>
                  <div class="rounded-xl bg-slate-50 border p-3"><div class="card-label">Problem Status</div><div class="mt-1 font-bold font-mono break-all">{{ selectedDevice.deviceStatus.ProblemStatus || selectedDevice.deviceStatus.ProblemStatusHex || '0x00000000' }}</div></div>
                  <div class="rounded-xl bg-slate-50 border p-3"><div class="card-label">Driver Loaded</div><div :class="['mt-1 font-bold', selectedDevice.deviceStatus.DriverLoaded ? 'text-emerald-700' : 'text-slate-600']">{{ selectedDevice.deviceStatus.DriverLoaded ? 'Yes' : 'No' }}</div></div>
                  <div class="rounded-xl bg-slate-50 border p-3"><div class="card-label">Device Started</div><div :class="['mt-1 font-bold', selectedDevice.deviceStatus.DeviceStarted ? 'text-emerald-700' : 'text-red-700']">{{ selectedDevice.deviceStatus.DeviceStarted ? 'Yes' : 'No' }}</div></div>
                  <div class="rounded-xl bg-slate-50 border p-3 md:col-span-2"><div class="card-label">DevNode Flags</div><div class="mt-2 flex flex-wrap gap-2"><span v-for="flag in (selectedDevice.deviceStatus.DevNodeFlags || [])" :key="flag" :class="['px-2 py-1 rounded-lg text-[11px] font-bold', flag==='DN_HAS_PROBLEM' ? 'bg-red-100 text-red-700' : 'bg-slate-200 text-slate-700']">{{ flag }}</span><span v-if="!(selectedDevice.deviceStatus.DevNodeFlags || []).length" class="text-slate-400">None</span></div><div class="text-[11px] text-slate-400 mt-2 font-mono">{{ selectedDevice.deviceStatus.DevNodeStatusHex || selectedDevice.deviceStatus.DevNodeStatusRaw || '' }}</div></div>
                  <div class="rounded-xl bg-slate-50 border p-3 md:col-span-2"><div class="card-label">Configuration Flags</div><div class="mt-2 flex flex-wrap gap-2"><span v-for="flag in (selectedDevice.deviceStatus.ConfigFlags || [])" :key="flag" class="px-2 py-1 rounded-lg text-[11px] font-bold bg-amber-100 text-amber-700">{{ flag }}</span><span v-if="!(selectedDevice.deviceStatus.ConfigFlags || []).length" class="text-slate-400">None</span></div><div class="text-[11px] text-slate-400 mt-2 font-mono">{{ selectedDevice.deviceStatus.ConfigFlagsHex || selectedDevice.deviceStatus.ConfigFlagsRaw || '' }}</div></div>
                </div>
              </div>
              <div class="pc-section-shell">
                <div class="pc-section-heading compact"><h3>Hardware IDs</h3></div><div class="pc-section-body">
                <pre class="bg-slate-100 rounded-xl p-3 text-xs min-h-[120px]">{{ (selectedDevice.hwids || []).join('\n') || 'N/A' }}</pre>
                </div>
              </div>
              <div class="pc-section-shell">
                <div class="pc-section-heading compact"><h3>Matching Drivers</h3></div><div class="pc-section-body">
                <div v-if="selectedDevice.matchingDrivers && selectedDevice.matchingDrivers.length" class="space-y-2">
                  <div v-for="m in selectedDevice.matchingDrivers" :key="m.name + m.status" class="rounded-xl border p-3 text-xs">
                    <div class="font-black">{{ m.name }}</div>
                    <div class="mt-1 text-slate-500">{{ m.status || 'N/A' }} | {{ m.date || '' }} {{ m.ver || '' }} | {{ m.signer || 'N/A' }}</div>
                  </div>
                </div>
                <div v-else class="text-slate-400 text-sm">No matching driver details loaded.</div>
                </div>
              </div>
            </div>
            <div v-else class="space-y-4">
              <section class="pc-section-shell">
                <div class="pc-section-heading">
                  <div><h2>Device Overview</h2><p>Device inventory and attention status for the current machine.</p></div>
                </div>
                <div class="pc-section-body grid grid-cols-2 xl:grid-cols-4 gap-3">
                  <div class="rounded-2xl border bg-slate-50 p-4">
                    <div class="text-[10px] uppercase tracking-widest font-black text-slate-500">Total Devices</div>
                    <div class="text-xl font-black mt-2">{{ fullDeviceList.length }}</div>
                    <div class="text-xs text-slate-500 mt-1">Loaded PnP devices</div>
                  </div>
                  <div class="rounded-2xl border border-red-200 bg-red-50 p-4">
                    <div class="text-[10px] uppercase tracking-widest font-black text-red-500">Problem Devices</div>
                    <div class="text-xl font-black text-red-700 mt-2">{{ problemDevicesCombined.length }}</div>
                    <div class="text-xs text-red-600 mt-1">Require investigation</div>
                  </div>
                  <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4">
                    <div class="text-[10px] uppercase tracking-widest font-black text-amber-600">Ghost Devices</div>
                    <div class="text-xl font-black text-amber-700 mt-2">{{ ghostDevices.length }}</div>
                    <div class="text-xs text-amber-600 mt-1">CM_PROB_PHANTOM</div>
                  </div>
                  <div class="rounded-2xl border border-slate-200 bg-white p-4">
                    <div class="text-[10px] uppercase tracking-widest font-black text-slate-500">Disabled Devices</div>
                    <div class="text-xl font-black text-slate-800 mt-2">{{ disabledDevices.length }}</div>
                    <div class="text-xs text-slate-500 mt-1">Reported as disabled</div>
                  </div>
                </div>
              </section>

              <section class="pc-section-shell">
                <div class="pc-section-heading flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                  <div><h2>Devices Requiring Attention</h2><p>Review problem, ghost and disabled devices, then open the matching device detail.</p></div>
                  <div class="flex flex-wrap gap-2">
                    <button @click="selectedProblemTab='problem'" :class="['px-3 py-2 rounded-xl border text-xs font-bold', selectedProblemTab==='problem' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50']">Problem ({{ problemDevicesCombined.length }})</button>
                    <button @click="selectedProblemTab='ghost'" :class="['px-3 py-2 rounded-xl border text-xs font-bold', selectedProblemTab==='ghost' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50']">Ghost ({{ ghostDevices.length }})</button>
                    <button @click="selectedProblemTab='disabled'" :class="['px-3 py-2 rounded-xl border text-xs font-bold', selectedProblemTab==='disabled' ? 'bg-slate-600 text-white border-slate-500' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50']">Disabled ({{ disabledDevices.length }})</button>
                  </div>
                </div>
                <div class="pc-section-body">
                <div v-if="selectedProblemTab==='problem'">
                  <div v-if="problemDevicesCombined.length" class="mt-3 space-y-3">
                    <div v-for="(pd,idx) in problemDevicesCombined" :key="idx" class="border border-red-200 bg-red-50 rounded-2xl p-4">
                      <div class="font-black text-slate-900 text-sm">{{ pd.name || pd.description || pd.FriendlyName || 'Unknown Device' }}</div>
                      <div class="text-xs text-slate-600 mt-2 break-all">{{ pd.pnpId || pd.instanceId || pd.InstanceId || 'N/A' }} <a v-if="getDeviceHuntInfo(pd.pnpId || pd.instanceId || pd.InstanceId)" :href="getDeviceHuntInfo(pd.pnpId || pd.instanceId || pd.InstanceId).url" target="_blank" rel="noopener noreferrer" class="ml-2 text-blue-600 hover:underline font-semibold whitespace-nowrap">[DeviceHunt]</a></div>
                      <div class="mt-3 text-sm font-bold text-red-700 break-all">{{ pd.error || pd.problem || pd.Problem || pd.ConfigManagerErrorCode || 'Device has issue' }}</div>
                      <button @click="openProblemDevice(pd)" class="mt-3 text-xs font-black text-blue-700 hover:underline">Open Device →</button>
                    </div>
                  </div>
                  <div v-else class="mt-3 rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-emerald-700 font-bold">目前沒有偵測到 Problem Device。</div>
                </div>

                <div v-else-if="selectedProblemTab==='ghost'">
                  <div v-if="ghostDevices.length" class="mt-3 space-y-3">
                    <div v-for="(gd,idx) in ghostDevices" :key="idx" class="border border-amber-200 bg-amber-50 rounded-2xl p-4">
                      <div class="flex items-start justify-between gap-2"><div class="font-black text-slate-900 text-sm">{{ gd.FriendlyName || gd.name || gd.description || 'Unknown Ghost Device' }}</div><span class="pc-badge px-2 py-1 text-[10px] font-black bg-slate-100 text-slate-500 shrink-0">GHOST</span></div>
                      <div class="text-xs text-slate-600 mt-2 break-all">{{ gd.InstanceId || gd.pnpId || gd.instanceId || 'N/A' }} <a v-if="getDeviceHuntInfo(gd.InstanceId || gd.pnpId || gd.instanceId)" :href="getDeviceHuntInfo(gd.InstanceId || gd.pnpId || gd.instanceId).url" target="_blank" rel="noopener noreferrer" class="ml-2 text-blue-600 hover:underline font-semibold whitespace-nowrap">[DeviceHunt]</a></div>
                      <div class="mt-3 text-sm font-bold text-amber-700 break-all">{{ gd.Problem || gd.ConfigManagerErrorCode || 'CM_PROB_PHANTOM' }}</div>
                      <button @click="openProblemDevice(gd)" class="mt-3 text-xs font-black text-blue-700 hover:underline">Open Device →</button>
                    </div>
                  </div>
                  <div v-else class="mt-3 rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600 font-bold">目前沒有偵測到 Ghost Device。</div>
                </div>

                <div v-else>
                  <div v-if="disabledDevices.length" class="mt-3 space-y-3">
                    <div v-for="dev in disabledDevices" :key="dev.instanceId" class="border border-slate-200 bg-slate-50 rounded-2xl p-4">
                      <div class="flex items-start justify-between gap-2"><div class="font-black text-slate-900 text-sm">{{ dev.name || 'Unknown Device' }}</div><span class="pc-badge px-2 py-1 text-[10px] font-black bg-slate-200 text-slate-700 shrink-0">DISABLED</span></div>
                      <div class="text-xs text-slate-600 mt-2 break-all">{{ dev.instanceId || 'N/A' }}</div>
                      <div class="mt-3 text-sm font-bold text-slate-700 break-all">{{ dev.problem || dev.status || dev.deviceStatus?.ProblemName || 'Disabled' }}</div>
                      <button @click="openProblemDevice(dev)" class="mt-3 text-xs font-black text-blue-700 hover:underline">Open Device →</button>
                    </div>
                  </div>
                  <div v-else class="mt-3 rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600 font-bold">目前沒有偵測到 Disabled Device。</div>
                </div>
                </div>
              </section>

              <div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-5 text-slate-500 text-sm font-semibold">Select a device from the left pane to inspect its Device Status, Hardware IDs and Matching Drivers.</div>
            </div>
          </div>
        </div>
        <div v-else class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 space-y-4">
          <div>
            <h2 class="text-lg font-black">Hardware List</h2>
            <p class="text-xs text-slate-500 mt-1">A focused hardware inventory of the functional components present on this machine.</p>
          </div>

          <div v-if="!Object.keys(hardwareInventory).length" class="rounded-2xl border border-amber-200 bg-amber-50 p-5 text-amber-800 font-bold">
            未載入 _HardwareInventory.json。請使用新版 Dowsing 收集 logs 後再拖入 Precog。
          </div>

          <div v-else class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-3">
            <div v-for="section in platformConfigurationSections" :key="section.title"
                 class="rounded-2xl border overflow-hidden bg-white min-w-0">
              <div class="pc-section-heading compact flex items-center justify-between gap-3">
                <h3 class="font-black text-sm text-white truncate">{{ section.title }}</h3>
                <span class="pc-badge px-2 py-1 text-[10px] font-black bg-slate-100 text-slate-600 shrink-0">{{ section.badge }}</span>
              </div>

                <div class="system-overview-card amber">
                  <div class="text-xs font-bold text-slate-500">Ghost Device</div>
                  <div class="text-xl font-black text-amber-600 mt-1">{{ ghostDevices.length }}</div>
                  <div class="text-[11px] font-bold text-amber-600 mt-1">CM_PROB_PHANTOM</div>
                </div>
                <div class="system-overview-card green">
                  <div class="text-xs font-bold text-slate-500">System Health</div>
                  <div class="text-xl font-black text-slate-900 mt-1">{{ systemHealthLoadedCount }} / 5</div>
                  <div class="text-[11px] font-bold text-slate-500 mt-1">Power reports loaded</div>
                </div>
                <div class="system-overview-card purple">
                  <div class="text-xs font-bold text-slate-500">Log Collection</div>
                  <div class="text-xl font-black text-slate-900 mt-1">{{ collectionOkCount }} / {{ Object.keys(collectionStatus).length }}</div>
                  <div class="text-[11px] font-bold mt-1" :class="collectionMissingCount ? 'text-amber-700' : 'text-emerald-700'">{{ collectionMissingCount ? collectionMissingCount + ' missing' : 'Completed' }}</div>
                </div>
              </div>
            </div>
            <div class="pc-section-shell">
              <div class="pc-section-heading"><div><h2>Driver Summary</h2><p>Driver inventory and binding status.</p></div></div>
              <div class="pc-section-body">
              <div class="grid grid-cols-2 gap-2">
                <div class="summary-box"><div class="text-[10px] text-slate-500">Drivers</div><div class="text-base font-black mt-1">{{ summaryCards.totalDrivers }}</div></div>
                <div class="summary-box green"><div class="text-[10px] text-emerald-700">Installed</div><div class="text-base font-black mt-1 text-emerald-700">{{ summaryCards.installed }}</div></div>
                <div class="summary-box amber"><div class="text-[10px] text-amber-700">No Matched</div><div class="text-base font-black mt-1 text-amber-700">{{ summaryCards.storeOnly }}</div></div>
                <div class="summary-box red"><div class="text-[10px] text-red-700">Problem</div><div class="text-base font-black mt-1 text-red-700">{{ summaryCards.problem }}</div></div>
              </div>
              <button @click="selectedOem = null; selectedPanel='overview'" class="mt-3 text-xs font-bold text-blue-600 hover:underline">View Driver Details →</button>
              </div>
            </div>
          </section>

          <section id="system-section-snapshot" class="pc-section-shell scroll-mt-4">
            <div class="pc-section-heading"><div><h2>System Snapshot</h2><p>Core platform identity and decoded Windows build information.</p></div></div>
            <div class="pc-section-body"><div class="snapshot-table">
              <div class="snapshot-row"><div class="snapshot-key">Computer Name</div><div class="snapshot-value">{{ systemSummary.ComputerName || systemSummary.CSName || 'N/A' }}</div><div class="snapshot-key">Manufacturer</div><div class="snapshot-value">{{ systemSummary.Manufacturer || 'N/A' }}</div></div>
              <div class="snapshot-row"><div class="snapshot-key">Model</div><div class="snapshot-value">{{ systemHeadline.model || 'N/A' }}</div><div class="snapshot-key">SKU / System SKU</div><div class="snapshot-value">{{ systemHeadline.sku || 'N/A' }}</div></div>
              <div class="snapshot-row"><div class="snapshot-key">BIOS Version</div><div class="snapshot-value">{{ systemHeadline.bios || 'N/A' }}</div><div class="snapshot-key">BIOS Release Date</div><div class="snapshot-value">{{ formatBiosReleaseDate(systemSummary.BIOSReleaseDate) }}</div></div>
              <div class="snapshot-row"><div class="snapshot-key">Windows Release</div><div class="snapshot-value">{{ windowsReleaseLabel }}</div><div class="snapshot-key">Secure Boot</div><div :class="['snapshot-value', secureBootClass]">{{ systemHeadline.secureBoot || 'N/A' }}</div></div>
              <div class="snapshot-row"><div class="snapshot-key">OS Name</div><div class="snapshot-value">{{ systemHeadline.os || 'N/A' }}</div><div class="snapshot-key">Memory</div><div class="snapshot-value">{{ systemSummary.TotalPhysicalMemoryGB ? systemSummary.TotalPhysicalMemoryGB + ' GB' : 'N/A' }}</div></div>
            </div></div>
          </section>

          <section id="system-section-hardware" class="grid grid-cols-1 2xl:grid-cols-2 gap-4 scroll-mt-4">
            <div class="pc-section-shell">
              <div class="pc-section-heading"><div><h2>Hardware Summary</h2><p>Core functional hardware inventory.</p></div></div>
              <div class="pc-section-body"><div class="space-y-2 text-sm">
                <div v-for="row in hardwareSummaryRows" :key="row.label" class="flex items-start gap-3 border-b last:border-b-0 pb-2 last:pb-0">
                  <div class="w-24 text-xs font-black text-slate-400 uppercase shrink-0">{{ row.label }}</div>
                  <div class="font-semibold break-all">{{ row.value || 'N/A' }}</div>
                </div>
              </div>
              <button @click="selectedPanel='configuration'" class="mt-4 text-xs font-bold text-blue-600 hover:underline">View Hardware Details →</button>
              </div>
            </div>
            <div id="system-section-devices" class="pc-section-shell scroll-mt-4">
              <div class="pc-section-heading flex items-center justify-between gap-3">
                <div><h2>Device Attention</h2><p>Problem and ghost device evidence.</p></div>
                <div class="flex gap-2">
                  <button @click="selectedProblemTab='problem'" :class="['px-3 py-2 rounded-xl border text-xs font-bold', selectedProblemTab==='problem' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50']">Problem ({{ problemDevicesCombined.length }})</button>
                  <button @click="selectedProblemTab='ghost'" :class="['px-3 py-2 rounded-xl border text-xs font-bold', selectedProblemTab==='ghost' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50']">Ghost ({{ ghostDevices.length }})</button>
                </div>
              </div>
              <div class="pc-section-body"><div v-if="selectedProblemTab==='problem'">
                <div v-if="problemDevicesCombined.length" class="space-y-2 max-h-[220px] overflow-y-auto custom-scrollbar pr-1">
                  <div v-for="(pd,idx) in problemDevicesCombined.slice(0,5)" :key="idx" class="rounded-xl border border-red-200 bg-red-50 p-3">
                    <div class="font-black text-sm">{{ pd.name || pd.description || pd.FriendlyName || 'Unknown Device' }}</div>
                    <div class="text-xs text-slate-600 mt-1 break-all">{{ pd.pnpId || pd.instanceId || pd.InstanceId || 'N/A' }}</div>
                  </div>
                </div>
                <div v-else class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-emerald-700 font-bold">目前沒有偵測到 Problem Device。</div>
              </div>
              <div v-else>
                <div v-if="ghostDevices.length" class="space-y-2 max-h-[220px] overflow-y-auto custom-scrollbar pr-1">
                  <div v-for="(gd,idx) in ghostDevices.slice(0,5)" :key="idx" class="rounded-xl border border-amber-200 bg-amber-50 p-3">
                    <div class="font-black text-sm">{{ gd.FriendlyName || gd.name || gd.description || 'Unknown Ghost Device' }}</div>
                    <div class="text-xs text-slate-600 mt-1 break-all">{{ gd.InstanceId || gd.pnpId || gd.instanceId || 'N/A' }}</div>
                  </div>
                </div>
                <div v-else class="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-600 font-bold">目前沒有偵測到 Ghost Device。</div>
              </div>
              <button @click="selectedPanel='deviceManager'" class="mt-4 text-xs font-bold text-blue-600 hover:underline">View All Devices →</button>
              </div>
            </div>
          </section>

          <section id="system-section-raw" class="pc-section-shell scroll-mt-4">
            <div class="pc-section-heading"><div><h2>Raw System Data</h2><p>Parsed source values for detailed inspection.</p></div></div>
            <div class="pc-section-body grid grid-cols-1 xl:grid-cols-2 gap-4">
              <div>
                <div class="flex items-center justify-between mb-3 gap-3"><h3 class="font-black">System Summary</h3><input v-model.trim="jsonFilter" placeholder="Filter key..." class="text-sm border rounded px-2 py-1"></div>
                <div class="raw-kv-list max-h-[420px] overflow-y-auto custom-scrollbar pr-1">
                  <div v-for="(value,key) in filteredSystemSummary" :key="key" class="raw-kv-row"><div class="raw-kv-key">{{ key }}</div><div class="raw-kv-value">{{ value }}</div></div>
                </div>
              </div>
              <div>
                <div class="flex items-center justify-between mb-3 gap-3"><div class="flex items-center gap-2"><h3 class="font-black">Windows Version (Parsed)</h3><button @click="showDecodedReg = !showDecodedReg" class="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50">{{ showDecodedReg ? 'Decoded' : 'Raw' }}</button></div><input v-model.trim="regFilter" placeholder="Filter key..." class="text-sm border rounded px-2 py-1"></div>
                <div class="raw-kv-list max-h-[420px] overflow-y-auto custom-scrollbar pr-1">
                  <div v-for="(value,key) in filteredWinReg" :key="key" class="raw-kv-row"><div class="raw-kv-key">{{ key }}</div><div class="raw-kv-value">{{ formatRegValue(key, value) }}</div></div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>

      <div v-else class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-12 gap-3">
        <div class="xl:col-span-4 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden min-h-0 flex flex-col">
          <div class="p-3 border-b bg-slate-50 space-y-2 shrink-0">
            <div>
              <h2 class="text-sm font-black text-slate-900">Driver Explorer</h2>
              <p class="text-[11px] text-slate-500 mt-1">Search and select an OEM INF package.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              <input v-model.trim="keyword" placeholder="搜尋 oem / inf / provider / device / HWID" class="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-200">
              <select v-model="filterProvider" class="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-200">
                <option value="All">All Providers</option>
                <option v-for="p in providers" :key="p" :value="p">{{ p }}</option>
              </select>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
              <button v-for="opt in statusOptions" :key="opt" @click="filterStatus=opt" :class="['rounded-xl px-3 py-2 text-xs font-bold border', filterStatus===opt ? 'bg-slate-900 text-white border-slate-900' : 'bg-white hover:bg-slate-50']">{{ opt }}</button>
            </div>
          </div>
          <div class="p-3 border-b bg-white text-xs text-slate-500 flex items-center justify-between shrink-0">
            <span>{{ finalFilteredDrivers.length }} / {{ dismDrivers.length }} drivers</span>
            <span>{{ loadedFileNames.length }} files loaded</span>
          </div>
          <div class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-100 min-h-0">
            <div v-for="d in finalFilteredDrivers" :key="d.publishedName" @click="selectedOem=d; selectedPanel='driver'" :class="['p-4 cursor-pointer border-l-4 transition', selectedOem && selectedOem.publishedName===d.publishedName ? 'bg-blue-50 border-l-blue-600' : 'border-l-transparent hover:bg-slate-50']">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-black text-slate-900 truncate text-sm">{{ d.publishedName }}</div>
                  <div class="text-sm text-slate-600 truncate">{{ d.originalName }}</div>
                  <div class="text-[11px] uppercase tracking-widest text-slate-400 mt-1 truncate">{{ d.providerName }}</div>
                </div>
                <div class="flex flex-col gap-1 items-end shrink-0">
                  <span :class="badgeClass(statusLabel(d))" class="pc-badge px-2 py-1 text-[10px] font-black whitespace-nowrap">{{ statusLabel(d) }}</span>
                  <span v-if="isNonWhql(d)" class="pc-badge px-2 py-1 text-[10px] font-black bg-yellow-100 text-yellow-700 whitespace-nowrap">NON-WHQL</span>
                  <span v-if="checkOemStatus(d).isProblem" class="pc-badge px-2 py-1 text-[10px] font-black bg-red-100 text-red-700 whitespace-nowrap">DEVICE ERROR</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="xl:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden min-h-0 flex flex-col">
          <div v-if="selectedPanel==='overview'" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 space-y-4">
            <section class="pc-section-shell">
              <div class="pc-section-heading flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
                <div><h2>Driver Overview</h2><p>Driver inventory, binding status and issues detected on the current machine.</p></div>
                <div class="text-xs font-bold text-slate-300">Select an INF from Driver Explorer to inspect its matched devices.</div>
              </div>
              <div class="pc-section-body grid grid-cols-2 xl:grid-cols-4 gap-3">
                <div class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-2">
                  <div class="text-[10px] uppercase tracking-widest font-black text-slate-400">Driver Store Packages</div>
                  <div class="text-xl font-black text-slate-900 mt-2">{{ summaryCards.totalDrivers }}</div>
                  <div class="text-[11px] text-slate-500 mt-1">OEM INF packages collected</div>
                </div>
                <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
                  <div class="text-[10px] uppercase tracking-widest font-black text-emerald-600">Installed Drivers</div>
                  <div class="text-xl font-black text-emerald-700 mt-2">{{ summaryCards.installed }}</div>
                  <div class="text-[11px] text-emerald-700 mt-1">Bound to current devices</div>
                </div>
                <div class="rounded-2xl border border-red-200 bg-red-50 p-4">
                  <div class="text-[10px] uppercase tracking-widest font-black text-red-500">Problem Devices</div>
                  <div class="text-xl font-black text-red-700 mt-2">{{ problemDevicesCombined.length }}</div>
                  <div class="text-[11px] text-red-700 mt-1">Require investigation</div>
                </div>
                <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4">
                  <div class="text-[10px] uppercase tracking-widest font-black text-amber-600">Unsigned / Non-WHQL</div>
                  <div class="text-xl font-black text-amber-700 mt-2">{{ summaryCards.nonWhql }}</div>
                  <div class="text-[11px] text-amber-700 mt-1">Signature attention</div>
                </div>
              </div>
            </section>

          </div>

          <div v-else-if="selectedPanel==='driver' && selectedOem" class="flex-1 min-h-0 flex flex-col">
            <div class="pc-identity-header shrink-0">
              <div class="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-4">
                <div class="min-w-0">
                  <div class="text-[10px] uppercase tracking-[0.2em] font-black text-slate-400">Driver Identity</div>
                  <div class="text-xl font-black tracking-tight mt-1 break-all">{{ selectedOem.publishedName || 'N/A' }}</div>
                  <div class="text-sm text-slate-300 mt-1 break-all">{{ selectedOem.originalName || 'N/A' }}</div>
                </div>
                <div class="flex flex-wrap gap-2 items-center shrink-0"><span :class="badgeClass(statusLabel(selectedOem))" class="px-3 py-2 rounded-full text-xs font-black">{{ statusLabel(selectedOem) }}</span><span v-if="checkOemStatus(selectedOem).isProblem" class="px-3 py-2 rounded-full text-xs font-black bg-red-100 text-red-700">SYS ERR</span><span v-if="isNonWhql(selectedOem)" class="px-3 py-2 rounded-full text-xs font-black bg-yellow-100 text-yellow-700">NON-WHQL</span></div>
              </div>
              <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-x-6 gap-y-3 border-t border-slate-700 pt-4">
                <div><div class="text-[10px] uppercase tracking-widest font-black text-slate-400">Published Name</div><div class="text-sm font-bold mt-1 break-all">{{ selectedOem.publishedName || 'N/A' }}</div></div>
                <div><div class="text-[10px] uppercase tracking-widest font-black text-slate-400">Provider</div><div class="text-sm font-bold mt-1 break-all text-emerald-300">{{ selectedOem.providerName || 'N/A' }}</div></div>
                <div><div class="text-[10px] uppercase tracking-widest font-black text-slate-400">Version</div><div class="text-sm font-bold mt-1 break-all">{{ selectedOem.version || 'N/A' }}</div></div>
                <div><div class="text-[10px] uppercase tracking-widest font-black text-slate-400">Catalog</div><div class="text-sm font-bold mt-1 break-all">{{ getCatalogFileName(selectedOem) }}</div></div>
              </div>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 space-y-4">
              <div v-if="analyzeDriver(selectedOem).length" class="space-y-2"><div v-for="(issue, idx) in analyzeDriver(selectedOem)" :key="idx" :class="['px-4 py-2 rounded-xl text-sm font-semibold', issue.level === 'error' ? 'bg-red-100 text-red-700' : issue.level === 'warn' ? 'bg-yellow-100 text-yellow-700' : 'bg-slate-100 text-slate-700']">{{ issue.text }}</div></div>

              <section class="rounded-2xl border border-slate-200 p-4">
                <div class="flex items-center justify-between gap-3 mb-3"><div><h3 class="font-black text-slate-900">Matched Devices</h3><p class="text-xs text-slate-500 mt-1">Devices currently bound to this OEM INF.</p></div><span class="pc-badge px-3 py-1 bg-slate-100 text-slate-600 text-xs font-black">{{ matchedPnpDevices.length }}</span></div>
                <div v-if="matchedPnpDevices.length===0" class="rounded-2xl border border-amber-200 bg-amber-50 p-5 text-amber-800 font-semibold text-sm">目前在系統上沒有找到對應使用這個 OEM INF 的裝置。這通常代表 package 在 driver store 中，但當前沒有 matched device。</div>
                <div v-else class="space-y-3">
                  <div v-for="(dev,idx) in matchedPnpDevices" :key="idx" class="rounded-2xl border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                      <div><div class="font-black text-slate-900 text-sm">{{ dev.description || 'Unknown Device' }}</div><div class="text-[11px] text-slate-500 mt-1 break-all">{{ dev.instanceId }}</div></div>
                      <div class="flex flex-wrap gap-2 items-center"><span :class="driverStatusClass(dev.specificInfStatus)" class="px-3 py-1 rounded-full text-[11px] font-black">{{ dev.specificInfStatus || 'N/A' }}</span><span v-if="getProblemData(dev.instanceId)" class="px-3 py-1 rounded-full text-[11px] font-black bg-red-100 text-red-700">Problem Device</span><button @click="openDeviceFromDriver(dev)" class="px-3 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700 text-xs font-black">Open in Device Manager</button></div>
                    </div>
                    <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div class="space-y-3 text-sm"><div><div class="card-label">Category</div><div class="font-semibold mt-1">{{ dev.deviceClass || 'N/A' }}</div></div><div><div class="card-label">Release Date</div><div class="font-semibold mt-1">{{ dev.specificInfDate || 'N/A' }}</div></div><div><div class="card-label">Signer</div><div class="font-semibold mt-1 break-all">{{ dev.specificInfSigner || 'N/A' }}</div></div><div v-if="getProblemData(dev.instanceId)" class="rounded-2xl border border-red-200 bg-red-50 p-3"><div class="text-[10px] uppercase tracking-widest text-red-500 font-bold">System Diagnostic</div><div class="mt-1 font-bold text-red-700 text-sm">{{ getProblemData(dev.instanceId).error || getProblemData(dev.instanceId).problem }}</div></div></div>
                      <div><div class="card-label">Hardware IDs</div><pre class="mt-2 rounded-2xl bg-slate-100 p-3 text-sm min-h-[160px] overflow-auto custom-scrollbar">{{ (dev.hwids || []).join('\n') || 'N/A' }}</pre></div>
                    </div>
                  </div>
                </div>
              </section>

            </div>
          </div>


          <div v-else class="flex-1 flex items-center justify-center text-slate-400 font-semibold">請從左側選擇一個 driver，或切換到 Driver Status / Device Manager / Platform Configuration / Platform Health。</div>
        </div>
      </div>
    </template>
  </div>
  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
